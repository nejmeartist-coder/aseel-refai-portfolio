<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aseel Refai | Instructional Designer & eLearning 
Portfolio</title>
    <style>
        :root { 
            --primary: #c25e38; 
            --primary-dark: #a04a29; 
            --text: #1f2937; 
            --text-muted: #4b5563; 
            --bg: #fdfbf7; 
            --card-bg: #ffffff; 
            --border: #e5e7eb; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", 
Roboto, sans-serif; 
            color: var(--text); 
            background: var(--bg); 
            line-height: 1.6; 
            padding-top: 5rem; 
            padding-bottom: 2.5rem;
        }
        
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(253, 251, 247, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            padding: 1rem 2rem;
        }
        .nav-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-logo {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            list-style: none;
        }
        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }
        .nav-links a:hover {
            color: var(--primary);
        }
        .nav-links a.nav-btn {
            background: var(--primary);
            color: white;
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
        }
        .nav-links a.nav-btn:hover {
            background: var(--primary-dark);
            color: white;
        }

        .container { max-width: 900px; margin: 0 auto; padding: 0 1rem; }
        
        header { 
            background: var(--card-bg); 
            padding: 4rem 2rem; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); 
            margin-bottom: 2.5rem; 
            border: 1px solid var(--border); 
            text-align: center; 
        }
        header h1 { font-size: 2.8rem; margin-bottom: 0.5rem; font-weight: 
800; color: var(--text); }
